<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS</title>
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H9l-4.2 3.3A.7.7 0 0 1 3.6 18.7V5.5Z"/></symbol>
  <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><path d="m16.5 17.5 1.6 1.6 3-3.2"/></symbol>
  <symbol id="i-memory" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M8.5 10h7M8.5 14h7"/></symbol>
  <symbol id="i-tools" viewBox="0 0 24 24"><path d="M14.5 6.3a3.6 3.6 0 0 1 5 5L11 19.8l-3.6-.4-.4-3.6L14.5 6.3Z"/><path d="m4 20 3-.6"/></symbol>
  <symbol id="i-skills" viewBox="0 0 24 24"><path d="M12 3.2 14 8l5 .4-3.8 3.3 1.1 4.9L12 14.2 7.7 16.6l1.1-4.9L5 8.4 10 8l2-4.8Z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M3 12h2.4M18.6 12H21M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4.2 11.3 19.4 4.7a.8.8 0 0 1 1.1 1l-4.6 15a.8.8 0 0 1-1.5.1l-2.6-6-6-2.6a.8.8 0 0 1-.1-1.5Z"/><path d="m11.3 14.7 8.3-8.3"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.8A.8.8 0 0 1 9.8 4h4.4a.8.8 0 0 1 .8.8V7M6.5 7l.8 12.2a1.8 1.8 0 0 0 1.8 1.7h5.8a1.8 1.8 0 0 0 1.8-1.7L17.5 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.2 5 6v6c0 4 3 7.3 7 8.8 4-1.5 7-4.8 7-8.8V6l-7-2.8Z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.5h-4.5"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
</svg>

<div class="shell" id="shell">
  <header class="top">
    <div class="brand">
      <span class="core" aria-hidden="true"></span>
      <span class="brand-text"><b id="assistantName">JARVIS</b><small id="brandSub">connecting…</small></span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnVoice" aria-label="Toggle spoken replies" title="Spoken replies"><svg class="icon"><use href="#i-volume"></use></svg></button>
      <button class="icon-btn" id="btnRefresh" aria-label="Refresh"><svg class="icon"><use href="#i-refresh"></use></svg></button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button class="tab is-on" data-tab="chat"><svg class="icon"><use href="#i-chat"></use></svg><span>Chat</span></button>
    <button class="tab" data-tab="tasks"><svg class="icon"><use href="#i-tasks"></use></svg><span>Tasks</span></button>
    <button class="tab" data-tab="skills"><svg class="icon"><use href="#i-skills"></use></svg><span>Skills</span></button>
    <button class="tab" data-tab="memory"><svg class="icon"><use href="#i-memory"></use></svg><span>Memory</span></button>
    <button class="tab" data-tab="tools"><svg class="icon"><use href="#i-tools"></use></svg><span>Tools</span></button>
    <button class="tab" data-tab="settings"><svg class="icon"><use href="#i-settings"></use></svg><span>Setup</span></button>
  </nav>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="sheet" class="sheet" hidden></div>

<script src="/app.js"></script>
</body>
</html>
