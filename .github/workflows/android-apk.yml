name: Build Men's Salon Android APK

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - ".github/workflows/android-apk.yml"
      - "salon-website/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and verify APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: salon-website/android-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor dependencies
        working-directory: salon-website/android-app
        run: npm ci --no-audit --no-fund

      - name: Bundle the bilingual salon website into the app
        working-directory: salon-website/android-app
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: salon-website/android-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK package and signature
        shell: bash
        run: |
          apk="salon-website/android-app/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -F "package: name='com.menssalon.nawada' versionCode='2' versionName='1.0.1'"
          mkdir -p salon-website/android-app/dist
          cp "$apk" salon-website/android-app/dist/Mens-Salon-Nawada-v1.0.1.apk
          (cd salon-website/android-app/dist && sha256sum Mens-Salon-Nawada-v1.0.1.apk > SHA256SUMS)

      - name: Upload APK download
        uses: actions/upload-artifact@v4
        with:
          name: mens-salon-android-apk
          path: salon-website/android-app/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish public Android release
        if: github.ref == 'refs/heads/arena/01e737c4-sunny' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: ${{ github.sha }}
          name: Men's Salon Android v1.0.1
          body: |
            Updated Android release for Men's Salon, Nawada.

            - Includes the bilingual English/Hindi salon site, new barber-shears branding, and the Help & Support panel.
            - Browsing works offline; WhatsApp booking and sharing require internet access.
            - Install the debug-signed APK on Android 7.0 or later. This is a sideload build, not a Play Store release.
            - `SHA256SUMS` contains the APK checksum.

          files: |
            salon-website/android-app/dist/Mens-Salon-Nawada-v1.0.1.apk
            salon-website/android-app/dist/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
