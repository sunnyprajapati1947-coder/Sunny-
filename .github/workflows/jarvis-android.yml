name: JARVIS Android APK

on:
  push:
    paths:
      - 'apps/jarvis-app/**'
      - 'apps/jarvis-pocket/index.html'
      - 'apps/jarvis-pocket/assets/**'
      - 'apps/jarvis-pocket/icons/**'
      - '.github/workflows/jarvis-android.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name to publish (blank = apps/jarvis-app/package.json)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: jarvis-android-release
  cancel-in-progress: false

jobs:
  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/jarvis-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Web checks
        run: |
          node --check apps/jarvis-pocket/assets/js/native.js
          node --check apps/jarvis-app/scripts/stage-web.mjs

      - name: Install and stage the app
        working-directory: apps/jarvis-app
        run: |
          npm ci
          npm run android:sync

      - name: Version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(node -p "require('./apps/jarvis-app/package.json').version")
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "JARVIS_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "JARVIS_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Publishing JARVIS $version (versionCode ${{ github.run_number }})"

      - name: Restore release signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/jarvis-app/.signing
          key: jarvis-signing-v3

      - name: Prepare release signing
        env:
          JARVIS_RELEASE_KEYSTORE_BASE64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_BASE64 }}
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          SPDYI_RELEASE_KEYSTORE_BASE64: ${{ secrets.SPDYI_RELEASE_KEYSTORE_BASE64 }}
          SPDYI_RELEASE_STORE_PASSWORD: ${{ secrets.SPDYI_RELEASE_STORE_PASSWORD }}
          SPDYI_RELEASE_KEY_ALIAS: ${{ secrets.SPDYI_RELEASE_KEY_ALIAS }}
        run: bash apps/jarvis-app/scripts/prepare-signing.sh

      - name: Check signing key file
        run: |
          test -s apps/jarvis-app/.signing/release.p12 || { echo '::error::keystore missing'; exit 1; }
          test -s apps/jarvis-app/.signing/password || { echo '::error::keystore password missing'; exit 1; }
          echo "signing key source: ${JARVIS_SIGNING_ORIGIN}"

      - name: Save release signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/jarvis-app/.signing
          key: jarvis-signing-v3

      - name: Assemble release APK
        working-directory: apps/jarvis-app/android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee /tmp/jarvis-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo "---- first errors ----"
            grep -nE "error:|error;|e: |FAILURE|Execution failed|What went wrong|Caused by" /tmp/jarvis-build.log | head -40 || true
            echo "---- last 120 lines ----"
            tail -120 /tmp/jarvis-build.log
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -nE "error:|error;|e: |Execution failed|What went wrong|Caused by" /tmp/jarvis-build.log | head -10)
          fi
          exit "$result"

      - name: Verify and package
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=apps/jarvis-app/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee dist/SIGNATURE.txt
          "$tools/aapt" dump badging "$apk" > dist/BADGING.txt
          if grep -q 'application-debuggable' dist/BADGING.txt; then
            echo '::error::Release APK must not be debuggable.'
            exit 1
          fi
          grep -q "package: name='com.sunnyai.jarvis'" dist/BADGING.txt
          grep -m1 'Signer #1 certificate SHA-256 digest' dist/SIGNATURE.txt | sed 's/.*digest: *//' > dist/.fingerprint
          name="JARVIS-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS.txt)

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          tag="jarvis-v${{ steps.version.outputs.name }}"
          cat > /tmp/notes.md <<'NOTES'
          Install the APK on your Android phone — no terminal, no Termux, no account.

          1. Tap the `.apk` below and allow "install unknown apps" for your browser or Files app.
          2. Open **JARVIS**. The Setup wizard walks through notifications, updates, permissions.
          3. Open **Settings → Local brain** and tap **Download** once (~490 MB over Wi-Fi).
             After that, chat works in airplane mode.

          **New in 1.1.0 — local only**
          - **One brain, and it is on the phone.** Qwen3.5 (text build) runs through Transformers.js + ONNX Runtime Web
            bundled inside the app. WebGPU when the phone has it, otherwise CPU/WASM.
          - **No cloud AI at all.** The API-key path is gone; an older setting that pointed at a cloud provider is
            migrated to local on read, so an update can never quietly call a remote model.
          - **Real model manager.** Downloads the exact files the engine asks for, straight into the phone cache with
            progress, speed, ETA, mirror fallback, SHA-256 verification, offline import from device storage and a
            Diagnose panel that reports the HTTP status of every source.
          - **Verified Android tools.** Battery/RAM/storage, app launch, notes with read-back checksums, calendar events
            (read back from the provider), reminders, media keys, notifications and sharing. Each result says
            `verified` or `unverified`, and Android limits are reported instead of being faked.
          - **SQLite memory + document search.** Memories, notes and tool history live in a local SQLite database;
            documents are split into passages and ranked with BM25 on the phone.
          - **Dashboard.** Live device readings, permission state with Allow buttons, knowledge base, tool history,
            cache/storage diagnostics and privacy switches.
          - **Microphone fixed.** RECORD_AUDIO is declared, requested at runtime, and voice input prefers the
            on-device recogniser.
          - **No more toast storms.** Identical messages collapse into one bubble.
          - **Memory budget + guard (new).** Android memory is measured at runtime (ActivityManager), JARVIS keeps to a
            configurable 1–10 GB budget, refuses a brain load that cannot fit, and unloads the engine instead of dying
            when the phone runs out of memory.
          - **Code studio (new).** Projects and files live in the app's SQLite database; the editor saves on this phone
            and runs the project in a sandboxed iframe. No terminal.
          - **Dashboard (new).** Live device readings, memory budget, permissions with Allow buttons, knowledge base,
            action log, engine diagnostics and privacy switches.

          **Still true**
          - Tasks tab: plan → run → retry → resume after the app is closed.
          - Video studio: prompt → script + animated scenes → WebM saved to `Movies/JARVIS`.
          - Connections tab: YouTube search, share sheet, device health.
          - In-app updater and the foreground service.

          **Honest limits**
          - The on-device model is small (0.8B). On a phone it answers at roughly 2–6 tokens/second on the CPU; WebGPU is faster.
          - Android lets a normal app confirm some actions (file writes, calendar inserts) and not others (opening another
            app, an alarm). The ones it cannot confirm are labelled unverified — by design.
          - Real AI video footage still needs a paid model. The studio writes the script and renders animated scenes locally.
          NOTES
          cert=$(cat dist/.fingerprint 2>/dev/null || echo unknown)
          printf '\n**Signer certificate SHA-256:** `%s`\n' "$cert" >> /tmp/notes.md
          printf '**Signing key:** %s\n' "${JARVIS_SIGNING_ORIGIN}" >> /tmp/notes.md
          printf '\nIf Android says \"App not installed\", your old JARVIS was signed with a different key: uninstall it once, then install this APK. Later updates install in place.\n' >> /tmp/notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "JARVIS ${{ steps.version.outputs.name }} — Android APK" --latest=false \
            --notes-file /tmp/notes.md dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: dist/
          retention-days: 30

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Touch the signing cache
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/jarvis-app/.signing
          key: jarvis-signing-v3
      - name: Report
        run: |
          if [ "${{ steps.signing-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Signing key cache is alive."
          else
            echo "::warning::Signing cache is missing; the next APK build will create a new signing key."
          fi
