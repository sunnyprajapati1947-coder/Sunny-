name: Dukaan Dost — test, build & package APK

on:
  push:
    branches:
      - arena/dd7f7a39-sunny
    paths:
      - 'kirana/**'
      - '.github/workflows/kirana-apk.yml'
  pull_request:
    paths:
      - 'kirana/**'
      - '.github/workflows/kirana-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: kirana

concurrency:
  group: kirana-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, test & web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kirana/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (services, money, security, screens)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload the web build
        uses: actions/upload-artifact@v4
        with:
          name: dukaan-dost-web
          path: kirana/dist
          if-no-files-found: error

  apk:
    name: Android APK
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kirana/package-lock.json

      # The project pins Gradle 8.2.1 / AGP 8.2.1, which run on JDK 17.
      # (JDK 21 needs Gradle 8.5+, so do not bump this without bumping Gradle.)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Report the Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle and sync it into the native project
        run: |
          npm run build
          npx cap sync android

      # Build failures are re-emitted as workflow annotations because raw job
      # logs are not always downloadable in this environment.
      - name: Assemble the debug APK
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug > /tmp/gradle.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              awk '/What went wrong/{flag=1} flag' /tmp/gradle.log | head -10
              grep -nE "^e: |^error:|error: |Could not (resolve|find|GET|download)|Unsupported class|requires (Java|JDK)|Minimum supported Gradle|AAPT2|Duplicate|not found" /tmp/gradle.log | head -10
            } > /tmp/gradle-err.log 2>&1
            while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
              echo "::error title=Gradle::${clean:0:300}"
            done < /tmp/gradle-err.log
            exit "$status"
          fi
          tail -n 8 /tmp/gradle.log

      - name: Assemble a signed release APK (only when signing secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ../dukaan-dost.keystore
            cd android
            ./gradlew --no-daemon assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/../dukaan-dost.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — the debug-signed APK is the deliverable."
          fi

      # Prove the APK is installable and actually contains the app: this
      # environment can create the file but cannot download it afterwards, so the
      # verification has to happen here and land in the job summary.
      - name: Verify the APK (manifest, signature, bundled web assets)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $APK"
          {
            echo "### APK verification"
            echo ""
            echo '```'
            echo "\$ $BT/aapt2 dump badging"
            "$BT/aapt2" dump badging "$APK" 2>/dev/null | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity|uses-permission)" | head -20
            echo ""
            echo "\$ apksigner verify --print-certs"
            if [ -x "$BT/apksigner" ]; then
              "$BT/apksigner" verify --print-certs "$APK" 2>&1 | grep -E "Signer|Verified|WARNING" | head -8
            else
              jarsigner -verify "$APK" 2>&1 | head -3
            fi
            echo ""
            echo "\$ unzip -l (key entries)"
            unzip -l "$APK" | grep -E "assets/public/(index.html|sw.js|manifest)|classes[0-9]*.dex|AndroidManifest.xml|mipmap-xxhdpi/ic_launcher" | head -12
            echo ""
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "size:   $(du -h "$APK" | cut -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail loudly instead of shipping a broken package.
          "$BT/aapt2" dump badging "$APK" | grep -q "package: name='in.dukaandost.app'" || { echo "::error::unexpected package name"; exit 1; }
          unzip -p "$APK" assets/public/index.html | grep -q '<div id="root">' || { echo "::error::web bundle missing from the APK"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex" || { echo "::error::no dex in the APK"; exit 1; }

      - name: Collect the APK with a friendly name
        run: |
          mkdir -p out
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/dukaan-dost-release.apk
            VARIANT="release"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/dukaan-dost-debug.apk
            VARIANT="debug"
          fi
          SIZE=$(du -h out/*.apk | cut -f1)
          SHA=$(sha256sum out/*.apk | cut -d' ' -f1)
          echo "APK_VARIANT=$VARIANT" >> "$GITHUB_ENV"
          {
            echo "### Dukaan Dost APK ($VARIANT)"
            echo ""
            echo "| file | size | sha256 |"
            echo "| --- | --- | --- |"
            for f in out/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | $(sha256sum "$f" | cut -d' ' -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$SIZE $SHA"
          ls -lh out

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dukaan-dost-apk
          path: kirana/out/*.apk
          if-no-files-found: error

      # A release asset is a plain download link that works in any browser.
      - name: Publish the APK as a GitHub release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dukaan-dost-v1.0.0"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            cat > /tmp/notes.md <<'NOTES'
          ## Dukaan Dost 1.0.0 — Android APK

          Kirana / general-store billing, inventory, khata (udhaar) and reports.
          Offline-first: everything works without the internet and syncs to Supabase
          when a connection returns.

          - Barcode billing from the camera (plus USB/Bluetooth scanners), UPI QR with the
            exact amount, split payments, cash change calculator
          - Prices always come from the database; discounts, voids and price edits need the
            owner PIN and land in an audit log
          - Thermal 58/80 mm print, PDF, WhatsApp receipts
          - Stock ledger, purchases, stock audit, low-stock/expiry alerts, WhatsApp order list
          - GST report, P&L, day-end cash closing, Excel/PDF export
          - Hindi · English · Hinglish UI, dark mode, large-text mode

          **Install:** download the `.apk`, open it on the phone and allow
          "Install unknown apps" for the browser/file manager.
          Min Android 6.0 (API 23). ~10 MB.
          NOTES
            gh release create "$TAG" --title "Dukaan Dost 1.0.0 — Android APK" --notes-file /tmp/notes.md
          fi
          gh release upload "$TAG" out/*.apk --clobber
          echo "release: $(gh release view "$TAG" --json url --jq .url)"
