name: Build Android APK

# Builds an installable APK of Bharat Map Quiz (Capacitor WebView wrapper around
# the offline single-file build) and attaches it to a GitHub Release, so the APK
# can be downloaded straight onto a phone.

on:
  push:
    branches:
      - arena/e68a5889-sunny
    paths:
      - "map-quiz/src/**"
      - "map-quiz/index.html"
      - "map-quiz/assets/**"
      - "map-quiz/tools/bundle.py"
      - "map-quiz/tools/prepare-android.mjs"
      - "map-quiz/tools/patch-android.mjs"
      - "map-quiz/package.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bharat-map-quiz-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: map-quiz
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('map-quiz/package.json') }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the offline web bundle
        run: python3 tools/bundle.py

      - name: Add the Capacitor Android project
        run: |
          set -e
          npm run android:prepare
          npx cap add android
          npx cap sync android

      - name: Restore signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: map-quiz/.signing
          key: bharat-map-quiz-signing-v1

      - name: Install the signing key into the Android project
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [ ! -s .signing/release.jks ]; then
            pass=$(openssl rand -hex 16)
            printf '%s' "$pass" > .signing/password
            keytool -genkeypair \
              -keystore .signing/release.jks \
              -alias bharat \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$pass" -keypass "$pass" \
              -dname "CN=Bharat Map Quiz, OU=Mobile, O=Bharat Map Quiz, L=Dhanbad, ST=Jharkhand, C=IN"
            echo "created a new signing key"
          else
            echo "reusing the cached signing key"
          fi
          pass=$(cat .signing/password)
          echo "::add-mask::$pass"
          cp .signing/release.jks android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=bharat\nkeyPassword=%s\n' \
            "$pass" "$pass" > android/keystore.properties
          echo "SIGNING_PASSWORD=$pass" >> "$GITHUB_ENV"
          test -s android/release.jks
          test -s android/keystore.properties
          echo "::notice title=signing::keystore installed into the android project"

      - name: Save signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: map-quiz/.signing
          key: bharat-map-quiz-signing-v1

      - name: Patch the Android project (icons, name, version, signing)
        run: node tools/patch-android.mjs

      - name: Assemble the APK
        run: |
          set -uo pipefail
          cd android
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "APK_KIND=release" >> "$GITHUB_ENV"
          else
            echo "::warning::release build failed — building a debug APK instead"
            grep -nE "error:|FAILURE|What went wrong|Caused by|> " /tmp/build.log | head -40 || true
            ./gradlew :app:assembleDebug --no-daemon 2>&1 | tail -40
            echo "APK_KIND=debug" >> "$GITHUB_ENV"
          fi

      - name: Report build state (annotations are readable from the API)
        if: always()
        run: |
          echo "kind=${APK_KIND:-unknown}" | sed 's/^/::notice title=kind::/'
          find android -name "*.apk" -o -name "*.aab" 2>/dev/null | head -10 | while read -r f; do
            echo "::notice title=artifact::$f"
          done
          echo "--- output tree ---"
          ls -R android/app/build/outputs 2>/dev/null | head -30 | while read -r line; do
            echo "::notice title=tree::$line"
          done
          echo "--- gradle errors ---"
          grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by:|Could not|Unable to|Execution failed" /tmp/build.log 2>/dev/null | head -12 | while IFS= read -r line; do
            echo "::error title=gradle::$line"
          done

      - name: Package (and sign if Gradle did not)
        run: |
          set -uo pipefail
          mkdir -p dist
          tools="$ANDROID_HOME/build-tools/34.0.0"
          name="Bharat-Map-Quiz-v1.0.apk"

          signed=android/app/build/outputs/apk/release/app-release.apk
          unsigned=android/app/build/outputs/apk/release/app-release-unsigned.apk
          debug=android/app/build/outputs/apk/debug/app-debug.apk

          if [ -s "$signed" ]; then
            cp "$signed" "dist/$name"
            echo "using the Gradle-signed release APK"
          elif [ -s "$unsigned" ]; then
            echo "::notice title=signing::signing the unsigned release APK with apksigner"
            "$tools/zipalign" -p -f 4 "$unsigned" /tmp/aligned.apk
            "$tools/apksigner" sign --ks android/release.jks --ks-key-alias bharat \
              --ks-pass "pass:$SIGNING_PASSWORD" --key-pass "pass:$SIGNING_PASSWORD" \
              --out "dist/$name" /tmp/aligned.apk
          elif [ -s "$debug" ]; then
            cp "$debug" "dist/$name"
            echo "::warning title=build::falling back to the debug APK"
          else
            echo "::error title=no-apk::Gradle produced no APK at all"
            find android -name "*.apk" | head -10
            exit 1
          fi

          ls -lh "dist/$name"
          "$tools/apksigner" verify --print-certs "dist/$name" > dist/SIGNATURE.txt 2>&1 \
            && echo "::notice title=signature::APK signature verified" \
            || echo "::warning title=signature::signature could not be verified"
          "$tools/aapt" dump badging "dist/$name" > dist/BADGING.txt 2>&1 || true
          grep -m2 -E "^package:|^application-label:" dist/BADGING.txt || true
          (cd dist && sha256sum "$name" > SHA256SUMS.txt) || true
          ls -lh dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="map-quiz-apk-v1.0"
          cat > /tmp/notes.md <<'NOTES'
          **Installable Android APK** of Bharat Map Quiz — the same app as the web build, packaged
          as an offline WebView app.

          - 7 quiz modes: find the state, identify the shape, capitals, neighbours, timed blitz,
            survival and speed run — plus a daily challenge
          - Learn map with capital + fact cards, levels/XP, 18 achievements, English UI
            (state names optionally in हिंदी)
          - Works completely offline; no ads, no accounts, no tracking

          **How to install**

          1. Download `Bharat-Map-Quiz-v1.0.apk` below (do it on the phone).
          2. Open the file. Android asks to allow installs from your browser/Files app —
             tap **Settings → Allow**, then **Install**.
          3. If Play Protect shows a warning (it does for self-signed apps), tap
             **More details → Install anyway**.

          Signed with a generated release key, so updates install in place. Uninstall once if you
          ever switch to a build signed with a different key.
          NOTES
          printf '\n**APK size:** %.1f MB · **Build:** %s\n' \
            "$(echo "$apk_size / 1048576" | bc -l)" "${APK_KIND:-release}" >> /tmp/notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber dist/*
          else
            gh release create "$tag" \
              --title "Bharat Map Quiz v1.0 (Android APK)" \
              --notes-file /tmp/notes.md \
              dist/*
          fi
          url=$(gh release view "$tag" --json assets -q '.assets[] | select(.name | endswith(".apk")) | .url')
          {
            echo "### ✅ APK published"
            echo ""
            echo "Download: <a href=\"https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Bharat-Map-Quiz-v1.0.apk\">Bharat-Map-Quiz-v1.0.apk</a>"
            echo ""
            echo "Variant: **${APK_KIND:-release}**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "asset: $url"
