name: Spdyi Android APK
on:
  push:
    branches: ['arena/a2d03b08-sunny']
    paths: ['spdyi/**', '.github/workflows/spdyi-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spdyi/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install SDK
        run: |
          echo "Using runner SDK: $ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Web tests and production bundle
        working-directory: spdyi
        run: npm ci && npm test && npm run android:sync
      - name: Assemble and lint Android app
        working-directory: spdyi/android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug :app:lintDebug --no-daemon 2>&1 | tee /tmp/spdyi-android-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -70 /tmp/spdyi-android-build.log)
          fi
          exit "$result"
      - name: Name APK and record hash
        run: |
          mkdir -p apk
          cp spdyi/android/app/build/outputs/apk/debug/app-debug.apk apk/Spdyi-Pro-debug.apk
          cd apk && sha256sum Spdyi-Pro-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Spdyi-Pro-Android-debug
          path: apk/
          retention-days: 14
