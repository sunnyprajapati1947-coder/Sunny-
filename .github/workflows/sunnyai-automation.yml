name: SunnyAI Automation Hub

on:
  push:
    branches: [main, audit/sunnyai-e2e-article-20261112]
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional fixed topic; leave empty for autonomous niche discovery'
        required: false
        type: string
      mode:
        description: 'Pipeline mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - prepare
          - render
          - publish
      privacy:
        description: 'YouTube visibility when publishing'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public
      upload:
        description: 'Allow YouTube publishing step'
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types: [sunnyai_job]

permissions:
  contents: read
  actions: read

concurrency:
  group: sunnyai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  automation:
    name: SunnyAI job
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOPIC: ${{ inputs.topic || github.event.client_payload.topic || '' }}
      MODE: ${{ inputs.mode || github.event.client_payload.mode || ((github.event_name == 'schedule' || github.ref == 'refs/heads/audit/sunnyai-e2e-article-20261112') && 'auto' || 'prepare') }}
      PRIVACY: ${{ inputs.privacy || github.event.client_payload.privacy || 'private' }}
      UPLOAD: ${{ inputs.upload || github.event.client_payload.upload || 'false' }}
    steps:
      - name: Checkout SunnyAI
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          set -e
          mkdir -p workspace/output workspace/logs
          printf '%s\n' \
            "topic=$TOPIC" \
            "mode=$MODE" \
            "privacy=$PRIVACY" \
            "upload=$UPLOAD" \
            "repo=${GITHUB_REPOSITORY}" \
            "run=${GITHUB_RUN_ID}" \
            "sha=${GITHUB_SHA}" > workspace/job.env
          cat workspace/job.env

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version | head -1
          espeak-ng --version | head -1
          python3 --version

      - name: Nova automation smoke tests
        run: |
          python3 -m unittest tests/test_automation_tools.py

      - name: Nova YouTube smoke tests
        run: |
          python3 -m unittest tests/test_youtube_tools.py

      - name: Nova security and schema regression tests
        run: |
          PYTHONPATH=. python3 tests/test_approval.py
          PYTHONPATH=. python3 tests/test_tool_schemas.py
          PYTHONPATH=. python3 tests/test_web_search_fallback.py

      - name: Run SunnyAI pipeline when present
        run: |
          set -e
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ "${GITHUB_REF:-}" != "refs/heads/audit/sunnyai-e2e-article-20261112" ]; then
            echo "Push validation only; pipeline generation remains schedule/manual-dispatch only."
            exit 0
          fi
          if [ -f automation/run.sh ]; then
            chmod +x automation/run.sh
            TOPIC="$TOPIC" MODE="$MODE" PRIVACY="$PRIVACY" UPLOAD="$UPLOAD" ./automation/run.sh
          else
            echo "No automation/run.sh yet; hub is initialized and waiting for the pipeline." | tee workspace/logs/pipeline.txt
          fi


      - name: Report Nova project diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path.home() / "Nova" / "youtube" / "projects"
          metadata_files = list(root.glob("*/metadata.json")) if root.is_dir() else []
          if not metadata_files:
              print("NOVA_DIAGNOSTICS: no project metadata created")
          else:
              latest = max(metadata_files, key=lambda p: p.stat().st_mtime)
              data = json.loads(latest.read_text(encoding="utf-8"))
              research = data.get("research") or {}
              print(json.dumps({
                  "project": latest.parent.name,
                  "research_sources": len(research.get("sources") or []),
                  "research_documents": len(research.get("documents") or []),
                  "script_words": len(str(data.get("script", "")).split()),
                  "qwen_used": bool(data.get("qwen_used")),
                  "status": data.get("status"),
              }))
          PY

      - name: Upload generated output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyai-run-${{ github.run_id }}
          path: workspace/
          if-no-files-found: warn
          retention-days: 7
