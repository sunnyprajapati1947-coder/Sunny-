name: Publish Men's Salon website

on:
  push:
    branches:
      - arena/01e737c4-sunny
    paths:
      - 'salon-website/**'
      - '.github/workflows/deploy-salon-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: salon-website-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the salon website
        uses: actions/upload-pages-artifact@v3
        with:
          path: salon-website

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
