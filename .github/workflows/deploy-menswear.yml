name: Deploy Men's Wear website

on:
  push:
    branches: [main, arena/42c450ee-sunny]
    paths:
      - "mens-wear/**"
      - ".github/workflows/deploy-menswear.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-mens-wear
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site (mens-wear folder becomes the site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: mens-wear

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
