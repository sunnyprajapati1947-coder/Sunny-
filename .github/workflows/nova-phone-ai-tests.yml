name: Nova Phone AI tests

on:
  push:
    paths:
      - "nova-phone-ai/**"
      - ".github/workflows/nova-phone-ai-tests.yml"
  pull_request:
    paths:
      - "nova-phone-ai/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: nova-phone-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit, integration and update tests (stdlib only, no pip installs)
        run: python -m unittest discover -s tests -t .
      - name: Shell script syntax
        run: bash -n install-termux.sh start.sh stop.sh doctor.sh update.sh scripts/common.sh bin/nova
