<script>
  /* Set the theme before first paint so there is no flash. */
  (function () {
    try {
      var theme = JSON.parse(localStorage.getItem('eccpocket.theme') || '"system"');
      var light = theme === 'light' || (theme !== 'dark' &&
        window.matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      document.documentElement.style.colorScheme = light ? 'light' : 'dark';
      var size = JSON.parse(localStorage.getItem('eccpocket.textSize') || '"m"');
      document.documentElement.dataset.textSize = /^(s|m|l|xl)$/.test(size) ? size : 'm';
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute('content', light ? '#faf7f3' : '#0b0d10');
      var statusBar = document.getElementById('appleStatusBar');
      if (statusBar) statusBar.setAttribute('content', light ? 'default' : 'black-translucent');
    } catch (error) { /* localStorage may be blocked */ }
  })();
</script>
