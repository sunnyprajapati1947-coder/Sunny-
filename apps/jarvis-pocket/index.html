<script>
  /* Paint the right theme before anything else loads. */
  (function () {
    try {
      var theme = JSON.parse(localStorage.getItem('jp.theme') || '"system"');
      var light = theme === 'light' || (theme !== 'dark' &&
        window.matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      document.documentElement.style.colorScheme = light ? 'light' : 'dark';
      var size = JSON.parse(localStorage.getItem('jp.textSize') || '"m"');
      document.documentElement.dataset.textSize = /^(s|m|l|xl)$/.test(size) ? size : 'm';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', light ? '#f6f5f2' : '#07080d');
      var bar = document.getElementById('appleStatusBar');
      if (bar) bar.setAttribute('content', light ? 'default' : 'black-translucent');
    } catch (error) { /* storage may be blocked */ }
  })();
</script>
