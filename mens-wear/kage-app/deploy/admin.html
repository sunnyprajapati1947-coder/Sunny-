<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner panel — Men's Wear, Nawada</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data:; connect-src https://zneqxctfhwehiuzibjnc.supabase.co wss://zneqxctfhwehiuzibjnc.supabase.co; base-uri 'none'; object-src 'none'; frame-ancestors 'none'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunnyprajapati1947-coder/Sunny-@app-v15/mens-wear/assets/css/admin.css">
</head>
<body>
<main class="adm">
  <div class="adm__top">
    <div class="adm__brand"><i>MW</i><div>Men's Wear<small>Owner panel</small></div></div>
    <button class="adm__btn adm__ghost" type="button" id="adminOut" hidden>Sign out</button>
  </div>

  <h1>Today's orders</h1>
  <p class="adm__sub">An order is saved the moment a customer taps <b>Order on WhatsApp</b> in the shop. New ones arrive by themselves — you get a beep and a notification, no refresh needed.</p>
  <p class="adm__note" id="adminStatus" role="status" aria-live="polite"></p>

  <section id="adminGate">
    <form class="adm__card-form" id="adminForm">
      <label>Email<input id="adminEmail" type="email" required autocomplete="username"></label>
      <label>Password<input id="adminPass" type="password" required autocomplete="current-password"></label>
      <button class="adm__btn" type="submit">Sign in</button>
      <button class="adm__btn adm__ghost" type="button" id="adminCopyMail">Copy my email</button>
    </form>
  </section>

  <section id="adminPanel" hidden>
    <p class="adm__who">Signed in as <b id="adminWho"></b></p>
    <div class="adm__list" id="adminList"></div>
    <p class="adm__empty" id="adminEmpty" hidden>No orders yet. As soon as someone taps Order on WhatsApp, it lands here.</p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/gh/sunnyprajapati1947-coder/Sunny-@app-v15/mens-wear/assets/js/vendor/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/gh/sunnyprajapati1947-coder/Sunny-@app-v15/mens-wear/assets/js/admin.js"></script>
</body>
</html>
