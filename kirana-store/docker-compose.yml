version: "3.9"
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      MONGODB_URI: mongodb://mongo:27017/rishu-kirana
    ports: ["5000:5000"]
    depends_on: [mongo]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  mongo-data:
